[package]
name = "airdrop-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# A Rust port of SEEMOO's opendrop (the AirDrop application layer).
# Runs over the awdl0 interface that awdl-rs brings up; talks to real Apple devices.

[[bin]]
name = "airdrop-rs"
path = "src/main.rs"

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
# Add as needed: rustls/tokio-rustls, hyper/axum, mdns/zeroconf, plist, flate2 (zlib),
# cpio, etc. (coordinate big additions with Claude)
